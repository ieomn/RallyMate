# The private file contains a self-hosted receiver URL accepting Alertmanager JSON.
global:
  resolve_timeout: 5m
route:
  receiver: webhook
  group_by: [alertname, job, instance, UUID]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: webhook
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/webhook_url
        send_resolved: true
        timeout: 10s
        max_alerts: 20
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/webhook_token
