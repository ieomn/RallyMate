# Copy into a private configuration directory and replace example.invalid values.
global:
  resolve_timeout: 5m
  smtp_smarthost: smtp.example.invalid:587
  smtp_from: rallymate@example.invalid
  smtp_auth_username: rallymate@example.invalid
  smtp_auth_password_file: /etc/alertmanager/secrets/smtp_password
  smtp_require_tls: true
route:
  receiver: email
  group_by: [alertname, job, instance, UUID]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: email
    email_configs:
      - to: operator@example.invalid
        send_resolved: true
        headers:
          Subject: '[RallyMate] {{ .Status | toUpper }} {{ .CommonLabels.alertname }}'
