global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    deployment: rallymate

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
  - job_name: rallymate-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    follow_redirects: false
    static_configs:
      - targets: [api:8000]
  - job_name: rallymate-worker
    static_configs:
      - targets: [worker:9101]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: dcgm
    static_configs:
      - targets: [dcgm-exporter:9400]
