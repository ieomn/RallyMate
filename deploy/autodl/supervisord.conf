[unix_http_server]
file=%(here)s/../../service_data/ops/supervisor.sock
chmod=0600

[supervisord]
logfile=%(here)s/../../service_data/ops/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=%(here)s/../../service_data/ops/supervisord.pid
childlogdir=%(here)s/../../service_data/ops
directory=%(here)s/../..
umask=0077
nodaemon=false
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/../../service_data/ops/supervisor.sock

[program:api]
command=/bin/bash "%(here)s/run-process.sh" api
directory=%(here)s/../..
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../../service_data/ops/api.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:worker]
command=/bin/bash "%(here)s/run-process.sh" worker
directory=%(here)s/../..
priority=20
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../../service_data/ops/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:web]
command=/bin/bash "%(here)s/run-process.sh" web
directory=%(here)s/../../scoring-demo-web
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../../service_data/ops/web.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:cloudflared]
command=/bin/bash "%(here)s/run-process.sh" cloudflared
directory=%(here)s/../..
priority=40
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../../service_data/ops/cloudflared.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:monitor]
command=/bin/bash "%(here)s/run-process.sh" monitor
directory=%(here)s/../..
priority=50
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../../service_data/ops/monitor.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
