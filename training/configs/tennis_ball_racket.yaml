schema_version: 1
name: rallymate-tennis-ball-racket-v1
task: detect
base_model: ../../models/yolo26n.pt
data: ../generated/tennis_ball_racket/dataset.yaml
output_dir: ../../runs/tennis_ball_racket
registry_dir: ../../model_registry
model_name: rallymate-tennis-ball-racket
license: internal-evaluation-only

classes:
  - tennis_ball
  - tennis_racket
  - racket_head

epochs: 120
image_size: 1280
batch: 8
device: "0"
workers: 4
patience: 25
seed: 42
freeze: 0
optimizer: auto
learning_rate: 0.002

augmentations:
  mosaic: 1.0
  mixup: 0.10
  scale: 0.50
  hsv_h: 0.015
  hsv_s: 0.70
  hsv_v: 0.40
  degrees: 12.0
  translate: 0.10
  fliplr: 0.50
  copy_paste: 0.15
  close_mosaic: 10
  motion_blur_prob: 0.35
  motion_blur_kernel_range: [3, 9]

tiny_ball_tuning:
  imgsz: 1280
  multi_scale: true
  min_ball_box_px: 4
  max_ball_aspect_ratio: 4.5

quality_gates:
  map50_95: 0.42
  precision: 0.80
  recall: 0.75
