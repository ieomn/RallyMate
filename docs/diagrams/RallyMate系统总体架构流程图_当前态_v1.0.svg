<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title desc">
  <title id="title">RallyMate 系统总体架构流程图</title>
  <desc id="desc">流程图分为用户接入与任务调度、视频理解与指标测量、当前 Beta 用户反馈闭环，以及尚未完成的正式评分证据链四部分。</desc>

  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #17243b; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #5f6f87; }
      .lane-title { font-size: 19px; font-weight: 700; }
      .node-title { font-size: 18px; font-weight: 700; text-anchor: middle; }
      .node-sub { font-size: 14px; fill: #52637a; text-anchor: middle; }
      .edge-label { font-size: 13px; font-weight: 600; }
      .legend { font-size: 14px; fill: #52637a; }
      .status { font-size: 17px; font-weight: 700; text-anchor: middle; fill: #991b1b; }
      .lane { stroke-width: 1.5; }
      .node { stroke-width: 2; filter: url(#shadow); }
      .run-edge { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .beta-edge { fill: none; stroke: #059669; stroke-width: 2.5; marker-end: url(#arrow-green); }
      .formal-edge { fill: none; stroke: #ea580c; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#arrow-orange); }
      .scope-edge { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 6; marker-end: url(#arrow-gray); }
    </style>
  </defs>

  <rect width="1800" height="1160" fill="#ffffff"/>
  <text x="60" y="52" class="title">RallyMate 系统总体架构</text>
  <text x="60" y="80" class="subtitle">当前运行链、13 项 Pose-only Beta 反馈与正式评分证据链分离展示</text>

  <!-- Lane 1 -->
  <rect x="40" y="105" width="1720" height="160" rx="20" fill="#f7faff" stroke="#9dbcf2" class="lane"/>
  <text x="70" y="140" class="lane-title" fill="#1d4ed8">① 用户接入与任务调度</text>

  <g>
    <rect x="220" y="160" width="280" height="72" rx="14" fill="#eaf2ff" stroke="#2563eb" class="node"/>
    <text x="360" y="191" class="node-title">用户 Demo / API 客户端</text>
    <text x="360" y="214" class="node-sub">上传视频 · 查询进度</text>

    <rect x="610" y="160" width="280" height="72" rx="14" fill="#eaf2ff" stroke="#2563eb" class="node"/>
    <text x="750" y="191" class="node-title">FastAPI 服务</text>
    <text x="750" y="214" class="node-sub">上传 · 状态 · 结果 · 产物</text>

    <rect x="1000" y="160" width="280" height="72" rx="14" fill="#eaf2ff" stroke="#2563eb" class="node"/>
    <text x="1140" y="191" class="node-title">SQLite 持久化队列</text>
    <text x="1140" y="214" class="node-sub">租约 · 进度 · 重试 · 状态</text>

    <rect x="1390" y="160" width="280" height="72" rx="14" fill="#eaf2ff" stroke="#2563eb" class="node"/>
    <text x="1530" y="191" class="node-title">Persistent Worker</text>
    <text x="1530" y="214" class="node-sub">GPU 优先 · CPU 4 线程池回退</text>
  </g>

  <path d="M500 196 H610" class="run-edge"/>
  <path d="M890 196 H1000" class="run-edge"/>
  <path d="M1280 196 H1390" class="run-edge"/>

  <!-- Lane 2 -->
  <rect x="40" y="285" width="1720" height="265" rx="20" fill="#f2fcfe" stroke="#84cfdf" class="lane"/>
  <text x="70" y="322" class="lane-title" fill="#0e7490">② 视频理解与指标测量</text>

  <g>
    <rect x="220" y="350" width="260" height="86" rx="14" fill="#e8faff" stroke="#0891b2" class="node"/>
    <text x="350" y="383" class="node-title">视频质量与元数据</text>
    <text x="350" y="407" class="node-sub">解码 · 时间戳 · 拍摄质量</text>

    <rect x="515" y="350" width="260" height="86" rx="14" fill="#e8faff" stroke="#0891b2" class="node"/>
    <text x="645" y="383" class="node-title">目标检测与 Tracking</text>
    <text x="645" y="407" class="node-sub">Player · Ball · Racket</text>

    <rect x="810" y="350" width="260" height="86" rx="14" fill="#e8faff" stroke="#0891b2" class="node"/>
    <text x="940" y="383" class="node-title">球员 ROI 姿态估计</text>
    <text x="940" y="407" class="node-sub">RTMPose-M · Halpe26</text>

    <rect x="1105" y="350" width="260" height="86" rx="14" fill="#e8faff" stroke="#0891b2" class="node"/>
    <text x="1235" y="383" class="node-title">主球员与动作事件</text>
    <text x="1235" y="407" class="node-sub">Viterbi · FS01 / FS02 / FS09</text>

    <rect x="1400" y="350" width="260" height="86" rx="14" fill="#e8faff" stroke="#0891b2" class="node"/>
    <text x="1530" y="383" class="node-title">特征与质量门禁</text>
    <text x="1530" y="407" class="node-sub">13 项 Pose-only · 当前 F2</text>
  </g>

  <path d="M480 393 H515" class="run-edge"/>
  <path d="M775 393 H810" class="run-edge"/>
  <path d="M1070 393 H1105" class="run-edge"/>
  <path d="M1365 393 H1400" class="run-edge"/>
  <path d="M1530 232 V300 H350 V350" class="run-edge"/>
  <text x="930" y="294" class="edge-label" fill="#1d4ed8">异步执行</text>

  <rect x="515" y="466" width="850" height="56" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="940" y="491" class="node-title" font-size="16">Ball / Racket / Court 线索保留</text>
  <text x="940" y="513" class="node-sub">当前 13 项不消费这些线索；其余 285 项尚未进入正式评分闭环</text>
  <path d="M645 436 V466" class="scope-edge"/>

  <!-- Lane 3 -->
  <rect x="40" y="570" width="1720" height="190" rx="20" fill="#f2fbf6" stroke="#82ccb0" class="lane"/>
  <text x="70" y="607" class="lane-title" fill="#047857">③ 当前用户反馈闭环（已实现）</text>

  <g>
    <rect x="220" y="630" width="260" height="84" rx="14" fill="#f3e8ff" stroke="#7c3aed" class="node"/>
    <text x="350" y="663" class="node-title">统一评分状态合同</text>
    <text x="350" y="687" class="node-sub">calibration_required / unavailable</text>

    <rect x="515" y="630" width="260" height="84" rx="14" fill="#ecfdf5" stroke="#059669" class="node"/>
    <text x="645" y="663" class="node-title">版本化白名单产物</text>
    <text x="645" y="687" class="node-sub">summary · features · reports</text>

    <rect x="810" y="630" width="260" height="84" rx="14" fill="#ecfdf5" stroke="#059669" class="node"/>
    <text x="940" y="663" class="node-title">用户结果适配器</text>
    <text x="940" y="687" class="node-sub">证据转换为自然语言反馈</text>

    <rect x="1105" y="630" width="260" height="84" rx="14" fill="#ecfdf5" stroke="#059669" class="node"/>
    <text x="1235" y="663" class="node-title">动作表现参考分（Beta）</text>
    <text x="1235" y="687" class="node-sub">严格 13 项 · 非正式教练分</text>

    <rect x="1400" y="630" width="260" height="84" rx="14" fill="#ecfdf5" stroke="#059669" class="node"/>
    <text x="1530" y="663" class="node-title">用户查看结果</text>
    <text x="1530" y="687" class="node-sub">分数或“暂无法评价” · 缺失≠0</text>
  </g>

  <path d="M480 672 H515" class="beta-edge"/>
  <path d="M775 672 H810" class="beta-edge"/>
  <path d="M1070 672 H1105" class="beta-edge"/>
  <path d="M1365 672 H1400" class="beta-edge"/>
  <path d="M1530 436 V590 H350 V630" class="run-edge"/>
  <text x="930" y="584" class="edge-label" fill="#1d4ed8">通过门禁后形成运行产物</text>

  <!-- Lane 4 -->
  <rect x="40" y="780" width="1720" height="300" rx="20" fill="#fff8f1" stroke="#efad78" class="lane"/>
  <text x="70" y="817" class="lane-title" fill="#c2410c">④ 正式评分证据链（当前尚未完成）</text>

  <g>
    <rect x="220" y="845" width="260" height="100" rx="14" fill="#fff7ed" stroke="#ea580c" class="node"/>
    <text x="350" y="879" class="node-title">原视频与冻结抽样</text>
    <text x="350" y="904" class="node-sub">模型候选只能辅助定位</text>
    <text x="350" y="925" class="node-sub">不能生成真值</text>

    <rect x="515" y="845" width="260" height="100" rx="14" fill="#fff7ed" stroke="#ea580c" class="node"/>
    <text x="645" y="879" class="node-title">独立人工真值</text>
    <text x="645" y="904" class="node-sub">A/B 标注 · C 裁决</text>
    <text x="645" y="925" class="node-sub">事件 · 关键点 · 语义 · 教练</text>

    <rect x="810" y="845" width="260" height="100" rx="14" fill="#fff7ed" stroke="#ea580c" class="node"/>
    <text x="940" y="879" class="node-title">误差与一致性评测</text>
    <text x="940" y="904" class="node-sub">Event F1 · IoU · MAE/P95</text>
    <text x="940" y="925" class="node-sub">Bias · valid rate · 教练一致性</text>

    <rect x="1105" y="845" width="260" height="100" rx="14" fill="#fff7ed" stroke="#ea580c" class="node"/>
    <text x="1235" y="879" class="node-title">标定候选与密封测试</text>
    <text x="1235" y="904" class="node-sub">防泄漏数据集 · 阈值/序数模型</text>
    <text x="1235" y="925" class="node-sub">独立测试不得反向调参</text>

    <rect x="1400" y="845" width="260" height="100" rx="14" fill="#fff7ed" stroke="#ea580c" class="node"/>
    <text x="1530" y="879" class="node-title">F3/F4 与可信发布</text>
    <text x="1530" y="904" class="node-sub">标定资产 · 晋级账本</text>
    <text x="1530" y="925" class="node-sub">运行 Profile / 机位绑定</text>
  </g>

  <path d="M480 895 H515" class="formal-edge"/>
  <path d="M775 895 H810" class="formal-edge"/>
  <path d="M1070 895 H1105" class="formal-edge"/>
  <path d="M1365 895 H1400" class="formal-edge"/>
  <path d="M1530 845 V805 H1715 V610 H350 V630" class="formal-edge"/>
  <text x="1430" y="799" class="edge-label" fill="#c2410c">仅全部通过后允许 scored</text>

  <rect x="220" y="982" width="1440" height="58" rx="14" fill="#fff1f2" stroke="#ef4444" stroke-width="2"/>
  <text x="940" y="1018" class="status">当前状态：13 项均为 F2；已接收人工真值记录为 0；正式 A～E 与正式跨事件/跨指标总分未启用</text>

  <!-- Legend -->
  <line x1="280" y1="1120" x2="340" y2="1120" stroke="#2563eb" stroke-width="4"/>
  <text x="355" y="1126" class="legend">当前运行链</text>
  <line x1="600" y1="1120" x2="660" y2="1120" stroke="#059669" stroke-width="4"/>
  <text x="675" y="1126" class="legend">当前 Beta 产品输出</text>
  <line x1="1010" y1="1120" x2="1070" y2="1120" stroke="#ea580c" stroke-width="4" stroke-dasharray="9 7"/>
  <text x="1085" y="1126" class="legend">待完成人工验证与发布链</text>
  <line x1="1450" y1="1120" x2="1510" y2="1120" stroke="#64748b" stroke-width="4" stroke-dasharray="6 6"/>
  <text x="1525" y="1126" class="legend">保留但未纳入本轮评分</text>
</svg>
